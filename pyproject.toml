[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "atom_world"
version = "0.1.2"
description = "AtomWorld package"
authors = [{name = "Taoyuze Lv, Alex, Fengyu Xie"}]
dependencies = [
    "numpy",
    "ase ==3.25.0",
    "pymatgen ==2025.6.14",
    "h5py >=3.14.0",
    "pandas",
    "matplotlib >=3.10.3",
    "seaborn >=0.13.2",
    "torch",
    "tqdm",
    "scipy",
    "pyyaml",
]

[project.scripts]
atomworld = "cli:main"

[project.optional-dependencies]

dev = [
    "pytest",
    "packaging",
]

inference = [
    "openai >=1.90.0",
    "transformers",
    "sentencepiece",
]