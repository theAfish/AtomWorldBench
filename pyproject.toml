[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "atomworld"
version = "0.1.2"
description = "AtomWorld: Benchmark and toolkit for crystal structure manipulation"
authors = [{name = "Taoyuze Lv, Alex, Fengyu Xie"}]
requires-python = ">=3.10"

# Core deps — enough for `from atomworld import evaluate`
dependencies = [
    "numpy",
    "pymatgen >=2024.1.26",
    "matplotlib >=3.10.3",
    "seaborn >=0.13.2",
]

[project.optional-dependencies]
# Running benchmarks (inference + offline evaluation)
benchmark = [
    "openai >=1.90.0",
    "pandas",
    "h5py >=3.14.0",
    "tqdm",
    "pyyaml",
    "packaging",
    "fastapi >=0.115.0",
    "uvicorn[standard] >=0.34.0",
    "pydantic >=2.0",
]
# Data generation
datagen = [
    "ase >=3.23.0",
    "mp-api",
    "scipy",
    "pandas",
]
# Local / HuggingFace model backends
models = [
    "transformers",
    "sentencepiece",
    "torch",
]
# Everything needed to run the full CLI
all = [
    "atomworld[benchmark,datagen,models]",
    "ray",
]
# Development & testing
dev = [
    "atomworld[all]",
    "pytest",
]

[project.scripts]
atomworld = "cli:main"