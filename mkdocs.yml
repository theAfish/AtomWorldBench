site_name: AtomWorldBench
site_description: Benchmark & toolkit for evaluating LLMs on 3D crystal-structure manipulation
site_url: https://theafish.github.io/AtomWorldBench/
repo_url: https://github.com/theAfish/AtomWorldBench
repo_name: theAfish/AtomWorldBench

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Dashboard: index.html
  - Getting Started:
    - Installation: installation.md
  - Python API:
    - Evaluate & Data Loading: python-api.md
    - Actions: actions.md
  - CLI: cli.md
  - Agent Mode: agent-mode.md
  - Data Generation: data-generation.md
  - Contributing: contributing.md
  - Citation: citation.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
  - footnotes
  - attr_list

extra:
  generator: false